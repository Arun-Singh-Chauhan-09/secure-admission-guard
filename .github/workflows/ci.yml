name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: unit + HTTPS tests (standard library only)
        run: python3 -m unittest discover -s tests -t . -v
      - name: base image pinned by digest (the rule the guard enforces on everyone else)
        run: grep -Eq '^FROM [^ ]+@sha256:[0-9a-f]{64}' Dockerfile
      - name: webhook config guard (blocks the outage config)
        run: |
          pip install pyyaml
          (cd tools && python3 -m unittest -v)
          python3 tools/check_webhook_config.py deploy/fixed

  drill:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with: { install_only: true }
      - name: fixed config survives a node drain
        run: |
          ./drill/run-drill.sh fixed
          grep -q "CoreDNS restarted: OK" drill/results-fixed.txt
          grep -q "denied the request" drill/results-fixed.txt

  scan:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t admission-guard:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "admission-guard:ci", severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1" }
