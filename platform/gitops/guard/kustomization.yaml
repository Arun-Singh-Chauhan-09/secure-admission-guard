# What Argo CD deploys on the platform cluster: deploy/fixed, plus the platform's own
# namespaces in the exemption list. Their images (Prometheus, Grafana, Argo CD, kind's
# local-path storage helper) come from public registries; in production they'd be mirrored
# into registry.internal and pinned by digest, and these exemptions would go away.
#
# local-path-storage: the provisioner creates a short-lived helper pod (busybox) to create
# each volume. Without this exemption the guard denies that pod and every new PVC hangs
# in Pending. Found when Loki's PVC never bound on a cluster where the guard was
# already running; CI missed it because there Loki is installed before the guard.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../deploy/fixed
patches:
  - target:
      group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: admission-guard
    patch: |-
      - op: replace
        path: /webhooks/0/namespaceSelector/matchExpressions/0/values
        value: [kube-system, admission-guard, cert-manager, monitoring, argocd, local-path-storage]
