    \      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 4,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n      \
    \  },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"\
    prometheus\"\n          },\n          \"expr\": \"sum by (result) (rate(admission_guard_decisions_total[5m]))\",\n          \"legendFormat\": \"{{result}}\"\n        }\n      ]\n    },\n    {\n    \
    \  \"id\": 6,\n      \"type\": \"timeseries\",\n      \"title\": \"API server -> webhook calls\",\n      \"description\": \"Seen from the API server: the only view that still works when the guard is\
