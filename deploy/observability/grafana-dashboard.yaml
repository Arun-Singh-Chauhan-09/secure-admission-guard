    \       \"h\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n     \
    \     \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum by (rejected) (rate(apiserver_admission_webhook_request_total{name=\\\
    \"pods.admission-guard.io\\\"}[5m]))\",\n          \"legendFormat\": \"rejected={{rejected}}\"\n        },\n        {\n          \"refId\": \"B\",\n          \"datasource\": {\n            \"type\"\
    : \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum(rate(apiserver_admission_webhook_rejection_count{name=\\\"pods.admission-guard.io\\\",error_type=\\\"\
    calling_webhook_error\\\"}[5m]))\",\n          \"legendFormat\": \"call errors (guard unreachable)\"\n        }\n      ]\n    },\n    {\n      \"id\": 7,\n      \"type\": \"timeseries\",\n      \"title\"\
    : \"Webhook call error ratio vs SLO\",\n      \"description\": \"\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n  \
    \      \"x\": 0,\n        \"y\": 12,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\"\n        },\n        \"overrides\"\
    : []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n\
    \          \"expr\": \"admission_guard:webhook_call_errors:ratio_rate5m\",\n          \"legendFormat\": \"5m\"\n        },\n        {\n          \"refId\": \"B\",\n          \"datasource\": {\n    \
    \        \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"admission_guard:webhook_call_errors:ratio_rate1h\",\n          \"legendFormat\": \"1h\"\n\
    \        },\n        {\n          \"refId\": \"C\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"vector(0.001)\"\
    ,\n          \"legendFormat\": \"SLO budget (0.1 %)\"\n        }\n      ]\n    },\n    {\n      \"id\": 8,\n      \"type\": \"timeseries\",\n      \"title\": \"Serving certificate: days left\",\n  \
    \    \"description\": \"cert-manager renews 10 days before expiry; the guard reloads it without a restart.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\
    \n      },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 12,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"d\"\
    \n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\"\
    : \"prometheus\"\n          },\n          \"expr\": \"(certmanager_certificate_expiration_timestamp_seconds{namespace=\\\"admission-guard\\\"} - time()) / 86400\",\n          \"legendFormat\": \"{{name}}\"\
    \n        }\n      ]\n    }\n  ]\n}"
