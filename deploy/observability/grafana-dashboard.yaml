    \              {\n                \"color\": \"orange\",\n                \"value\": 1\n              },\n              {\n                \"color\": \"green\",\n                \"value\": 2\n     \
    \         }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n  \
    \        ]\n        },\n        \"colorMode\": \"background\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\"\
    ,\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum(up{namespace=\\\"admission-guard\\\"}) or vector(0)\"\n        }\n      ]\n    },\n    {\n      \"id\": 2,\n      \"type\"\
    : \"stat\",\n      \"title\": \"Webhook call success (1h)\",\n      \"description\": \"SLI: API server calls that got an answer (allowed or denied). SLO 99.9 %.\",\n      \"datasource\": {\n       \
    \ \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"x\": 6,\n        \"y\": 0,\n        \"w\": 6,\n        \"h\": 4\n      },\n      \"fieldConfig\"\
    : {\n        \"defaults\": {\n          \"unit\": \"percentunit\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\"\
    : \"red\",\n                \"value\": null\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 0.99\n              },\n              {\n         \
    \       \"color\": \"green\",\n                \"value\": 0.999\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\"\
    : {\n          \"calcs\": [\n            \"lastNotNull\"\n          ]\n        },\n        \"colorMode\": \"background\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n   \
    \       \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"1 - (admission_guard:webhook_call_errors:ratio_rate1h or vector(0))\"\
    \n        }\n      ]\n    },\n    {\n      \"id\": 3,\n      \"type\": \"stat\",\n      \"title\": \"Error budget burn rate (1h)\",\n      \"description\": \"1 = spending the 30-day budget exactly on\
    \ schedule. 14.4 pages, 6 opens a ticket.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"x\": 12,\n      \
    \  \"y\": 0,\n        \"w\": 6,\n        \"h\": 4\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"thresholds\": {\n            \"mode\": \"\
    absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"orange\"\
    ,\n                \"value\": 6\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 14.4\n              }\n            ]\n          }\n        },\n  \
    \      \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ]\n        },\n        \"colorMode\": \"background\"\
    \n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n    \
    \      \"expr\": \"(admission_guard:webhook_call_errors:ratio_rate1h or vector(0)) / 0.001\"\n        }\n      ]\n    },\n    {\n      \"id\": 4,\n      \"type\": \"stat\",\n      \"title\": \"Avg decision\
    \ time (5m)\",\n      \"description\": \"\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"x\": 18,\n      \
    \  \"y\": 0,\n        \"w\": 6,\n        \"h\": 4\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\",\n          \"thresholds\": {\n            \"mode\": \"absolute\"\
    ,\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"orange\",\n    \
    \            \"value\": 0.1\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 1\n              }\n            ]\n          }\n        },\n        \"\
    overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ]\n        },\n        \"colorMode\": \"background\"\n \
    \     },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n      \
    \    \"expr\": \"admission_guard:latency_seconds:avg_rate5m\"\n        }\n      ]\n    },\n    {\n      \"id\": 5,\n      \"type\": \"timeseries\",\n      \"title\": \"Decisions per second by result\"\
