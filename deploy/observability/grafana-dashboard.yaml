# Grafana's dashboard sidecar picks up every ConfigMap labelled grafana_dashboard="1".
apiVersion: v1
kind: ConfigMap
metadata:
  name: admission-guard-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  admission-guard.json: "{\n  \"title\": \"Admission Guard\",\n  \"uid\": \"admission-guard\",\n  \"tags\": [\n    \"admission-guard\",\n    \"slo\"\n  ],\n  \"timezone\": \"browser\",\n  \"schemaVersion\"\
    : 39,\n  \"refresh\": \"30s\",\n  \"time\": {\n    \"from\": \"now-1h\",\n    \"to\": \"now\"\n  },\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"type\": \"stat\",\n      \"title\": \"Replicas\
    \ up\",\n      \"description\": \"0 = outage (failurePolicy Fail); 1 = one failure away from an outage.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\
    \n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\": 6,\n        \"h\": 4\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\
