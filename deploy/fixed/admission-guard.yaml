apiVersion: v1
kind: Namespace
metadata:
  name: admission-guard
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admission-guard
  namespace: admission-guard
automountServiceAccountToken: false   # the webhook never calls the Kubernetes API
---
# The guard protects every pod create in the cluster, so it must not be the first thing
# evicted under memory pressure. Below the built-in system-* classes, above all apps.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: admission-guard-critical
value: 1000000
globalDefault: false
description: Admission webhook that guards the whole cluster; evict last.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admission-guard
  namespace: admission-guard
  labels: { app.kubernetes.io/name: admission-guard }
spec:
  replicas: 2                          # FIX: one replica = one eviction from a cluster-wide outage
  selector:
    matchLabels: { app.kubernetes.io/name: admission-guard }
  template:
    metadata:
      labels: { app.kubernetes.io/name: admission-guard }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: admission-guard
      priorityClassName: admission-guard-critical   # FIX: evicted last when a node runs short
      affinity:
        podAntiAffinity:               # FIX: never both replicas on the node being drained
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: { app.kubernetes.io/name: admission-guard }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: guard
          # kind drill image. In production: registry.internal/admission-guard@sha256:<digest>,
          # which also passes the guard's own policy.
          image: admission-guard:dev
          imagePullPolicy: IfNotPresent
          args:
            - --allowed-registries=registry.internal/
            - --require-digest=true
            - --enforce=true
          ports:
            - { name: https, containerPort: 8443 }
            - { name: metrics, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: certs, mountPath: /certs, readOnly: true }
      volumes:
        - name: certs
          secret: { secretName: admission-guard-tls }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: admission-guard
  namespace: admission-guard
spec:
  minAvailable: 1                      # FIX: a drain may take one replica, never both
  selector:
    matchLabels: { app.kubernetes.io/name: admission-guard }
---
# Default deny, then allow only what the guard needs.
# - 8443 (webhook): the caller is the API server, which is not a pod and can't be picked
#   by a pod selector, so the port is open to the network; TLS is the control here.
# - 8080 (/metrics, /healthz): only from the monitoring namespace. Kubelet probes come
#   from the node itself, which network policy implementations allow.
# - Egress: none. The guard never calls anything (no API server, no DNS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admission-guard
  namespace: admission-guard
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: admission-guard }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{ protocol: TCP, port: 8443 }]
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports: [{ protocol: TCP, port: 8080 }]
  egress: []
---
apiVersion: v1
kind: Service
metadata:
  name: admission-guard
  namespace: admission-guard
spec:
  selector: { app.kubernetes.io/name: admission-guard }
  ports:
    - { name: https, port: 443, targetPort: https }
---
# cert-manager issues the serving cert and injects its CA into the webhook config.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned
  namespace: admission-guard
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: admission-guard
  namespace: admission-guard
spec:
  secretName: admission-guard-tls
  duration: 720h
  renewBefore: 240h                    # the binary reloads the file, no restart needed
  dnsNames:
    - admission-guard.admission-guard.svc
  issuerRef: { name: selfsigned, kind: Issuer }
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: admission-guard
  annotations:
    cert-manager.io/inject-ca-from: admission-guard/admission-guard
webhooks:
  - name: pods.admission-guard.io
    admissionReviewVersions: ["v1"]
    sideEffects: None                  # required for kubectl --dry-run=server
    failurePolicy: Fail                # security: if the guard is down, nothing unchecked runs...
    timeoutSeconds: 3                  # ...but fail fast instead of stalling every pod create for 10 s
    # FIX: never guard the guard itself, nor the control plane's own add-ons.
    # kubernetes.io/metadata.name is set by the API server and cannot be faked by a
    # team, unlike a custom "exempt: true" label that anyone allowed to label a namespace could add.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, admission-guard, cert-manager]
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
        scope: Namespaced
    clientConfig:
      service:
        name: admission-guard
        namespace: admission-guard
        path: /validate
